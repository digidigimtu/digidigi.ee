# GitHub Pages build settings.
# The site is plain HTML and CSS; this file only decides which files get published.

# Dot-folders are skipped by default, so nothing private can be published by accident.
# .well-known is the one exception: it holds security.txt.
include:
  - .well-known

# Not part of the website. Setting this list replaces GitHub Pages' own default,
# which is to leave out CNAME, so CNAME has to be named here as well.
exclude:
  - README.md
  - CNAME
